name: Daily Dashboard Update

on:
  schedule:
    # Run at 6:30 AM ET (10:30 UTC) on weekdays
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "bot@accuvest.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Daily dashboard update $(date +'%Y-%m-%d')"
          git push
